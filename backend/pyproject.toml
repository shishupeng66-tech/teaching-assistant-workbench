[project]
name = "teaching-assistant-workbench-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7,<1",
  "pillow>=11,<13",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "httpx2>=2.16.2",
    "ruff>=0.14,<1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
